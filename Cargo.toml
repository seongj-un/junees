[package]
name = "junees"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small, fast AI agent harness written in Rust"
license = "MIT"
repository = "https://github.com/seongj-un/junees"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "alloc"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Already built for rustls; its HMAC checks webhook signatures.
ring = { version = "0.17", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "fs", "time", "signal", "net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
