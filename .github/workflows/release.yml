name: Release

# A `v*` tag builds the release archives, checks them into SHA256SUMS,
# attests their provenance and publishes the GitHub release. Run by hand
# (workflow_dispatch) with `publish` off, or in a pull request that changes
# this file, it only builds and uploads the archives as workflow artifacts.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the GitHub release (the run must be on a v* tag)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against Cargo.toml
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 | jq -r '.packages[] | select(.name == "junees") | .version')
          if [ -z "$version" ]; then
            echo "::error::cannot read the version from Cargo.toml"
            exit 1
          fi
          publish=false
          if [ "$EVENT" = push ] || { [ "$EVENT" = workflow_dispatch ] && [ "$PUBLISH_INPUT" = true ]; }; then
            publish=true
          fi
          if [ "$publish" = true ]; then
            if [ "$REF_TYPE" != tag ]; then
              echo "::error::publishing needs a v* tag; run the workflow on the tag, or with publish off"
              exit 1
            fi
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::tag $REF_NAME does not match the version in Cargo.toml ($version): expected v$version"
              exit 1
            fi
          fi
          echo "version $version, publish $publish"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          # Static Linux binaries, cross-compiled with cargo-zigbuild (zig
          # as the C compiler and linker for ring and the musl link).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
            runs_here: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
            runs_here: false
          # The macOS runner is Apple silicon; Xcode builds both.
          - target: x86_64-apple-darwin
            os: macos-latest
            zig: false
            runs_here: false
          - target: aarch64-apple-darwin
            os: macos-latest
            zig: false
            runs_here: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          cat > "$RUNNER_TEMP/zigbuild.txt" <<'EOF'
          cargo-zigbuild==0.24.1 --hash=sha256:238a1ab54a95053a4eadc34775c81f795a8ad75f80bfed63f3f445f518102375
          ziglang==0.17.1 --hash=sha256:ea6cc5d87b033cf0aedfbc8f9549a908cae6c50ac31f1698188fa48a74524b54
          EOF
          "$RUNNER_TEMP/zigbuild/bin/pip" install --require-hashes --only-binary :all: -r "$RUNNER_TEMP/zigbuild.txt"
          # cargo-zigbuild finds zig through `python3 -m ziglang`.
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          if [ "$ZIG" = true ]; then
            cargo zigbuild --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
          # No AppleDouble (._*) files from macOS tar.
          COPYFILE_DISABLE: "1"
        run: |
          stem="junees-$VERSION-$TARGET"
          mkdir -p "dist/$stem"
          cp "target/$TARGET/release/junees" LICENSE README.md "dist/$stem/"
          tar -C dist -czf "dist/$stem.tar.gz" "$stem"
          tar -tzf "dist/$stem.tar.gz"
          echo "stem=$stem" >> "$GITHUB_OUTPUT"
      - name: Run the binary
        if: matrix.runs_here
        env:
          STEM: ${{ steps.package.outputs.stem }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          out=$("dist/$STEM/junees" --version)
          echo "$out"
          [ "$out" = "junees $VERSION" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junees-${{ matrix.target }}
          path: dist/${{ steps.package.outputs.stem }}.tar.gz
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junees-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          count=$(find . -maxdepth 1 -name 'junees-*.tar.gz' | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 archives, found $count"
            exit 1
          fi
          sha256sum -- junees-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/junees-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  attest:
    name: Provenance
    needs: [version, checksums]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/junees-*.tar.gz
            dist/SHA256SUMS

  release:
    name: GitHub release
    needs: [version, attest]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
          esac
          # shellcheck disable=SC2086
          gh release create "v$VERSION" dist/junees-*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "junees $VERSION" \
            --generate-notes \
            $prerelease
